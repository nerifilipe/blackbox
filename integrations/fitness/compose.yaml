services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: blackbox
      POSTGRES_PASSWORD: blackbox_local
      POSTGRES_DB: blackbox
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackbox -d blackbox"]
      interval: 2s
      timeout: 5s
      retries: 20
